<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="banner-title">
  <title id="banner-title">PyOQ, fully typed database-first SQL for Python</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1220" />
      <stop offset="1" stop-color="#131c2f" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b6ef3" stop-opacity="0.42" />
      <stop offset="0.55" stop-color="#1b6ef3" stop-opacity="0.13" />
      <stop offset="1" stop-color="#1b6ef3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b6ef3" />
      <stop offset="1" stop-color="#1b6ef3" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)" />
  <circle cx="1046" cy="118" r="392" fill="url(#glow)" />
  <rect x="0" y="0" width="1200" height="6" fill="url(#rule)" />

  <g transform="translate(96 128) scale(1.75)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#1b6ef3" />
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
      <path d="M18 49V16h17" />
      <circle cx="35" cy="31" r="15" />
      <path d="m45 42 7 7" />
    </g>
    <g fill="#fff">
      <rect x="28" y="24" width="5" height="5" rx="1" />
      <rect x="36" y="24" width="5" height="5" rx="1" />
      <rect x="28" y="32" width="5" height="5" rx="1" />
      <rect x="36" y="32" width="5" height="5" rx="1" />
    </g>
  </g>

  <text x="232" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#ffffff" letter-spacing="-2">PyOQ</text>
  <text x="236" y="238" font-family="Menlo, Consolas, monospace" font-size="21" fill="#7c9bd6" letter-spacing="3">PIP INSTALL PYOQ-SQL</text>

  <text x="96" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="600" fill="#eef2f9" letter-spacing="-1">Fully typed, database-first SQL</text>
  <text x="96" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="600" fill="#eef2f9" letter-spacing="-1">for Python.</text>

  <rect x="96" y="470" width="1008" height="1" fill="#26324a" />

  <text x="96" y="533" font-family="Menlo, Consolas, monospace" font-size="25" fill="#7f8ba3"
    >dsl.<tspan fill="#6fb0ff">select</tspan>(TITLES.NAME).<tspan fill="#6fb0ff">from_</tspan>(TITLES)</text>

  <text x="96" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#5f6f8c"
    >Generated types<tspan dx="20" fill="#3d4a63">·</tspan><tspan dx="20">Explicit execution</tspan><tspan dx="20" fill="#3d4a63">·</tspan><tspan dx="20">Native acceleration</tspan></text>
</svg>
